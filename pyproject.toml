[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sluggi"
version = "0.1.2"
description = "A Python library and CLI for turning text into clean, URL-safe slugs."
authors = [{ name = "atillaguzel" }]
license = { text = "MIT" }
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
keywords = [
    "slug",
    "slugify",
    "url",
    "text",
    "python",
    "unicode",
    "transliteration",
    "cli"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Operating System :: OS Independent",
    "Natural Language :: English"
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.4.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.5",
    "pytest-asyncio>=1.4.1.post1"
]
cli = [
    "typer>=0.27.3",
    "rich>=15.0.0"
]
dev = [
    "black>=25.1.0",
    "pre-commit>=4.6.2",
    "ruff>=0.17.3",
    "python-slugify>=9.1.3"
]
emoji = [
    "emoji>=2.16.0"
]

[project.scripts]
sluggi = "sluggi.cli:app"

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "D",    # pydocstyle (docstring style)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python syntax)
    "N",    # pep8-naming
]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D205", # 1 blank line required between summary line and description
    "D213", # multi-line-summary-second-line (conflicts with D212)
    "UP038", # deprecated upstream: isinstance(x, (A, B)) is the faster form
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
# Lock-only floor for the eMudhra/emSign CA compromise (Oct 2026): older
# certifi bundles still trust the compromised CAs. Nothing pulls certifi into
# the lock today (requests left with the badge script), and the floor stays so
# that whatever brings it back cannot resolve to an old bundle. Not part of the
# published package metadata.
constraint-dependencies = ["certifi>=2026.10.19"]

[project.urls]
Homepage = "https://github.com/blip-box/sluggi"
Repository = "https://github.com/blip-box/sluggi"
Documentation = "https://github.com/blip-box/sluggi#readme"
Changelog = "https://github.com/blip-box/sluggi/releases"
Issues = "https://github.com/blip-box/sluggi/issues"
