# Builds the MkDocs site in docs/ and deploys it to GitHub Pages on every push
# to main. The docs build is not part of uv.lock; the pins below are updated
# by hand.
name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A repository has a single Pages deployment, so concurrent runs contend for it.
# Serialise them: let an in-flight deployment finish rather than cancelling it,
# and drop superseded queued runs, since only the newest commit matters.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install mkdocs-shadcn==0.5.0 bottle==0.13.2 pymdown-extensions==10.14.3 pygments==2.19.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mkdocs
          path: .cache
      - run: cd docs && mkdocs build -d ../site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # prove the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
