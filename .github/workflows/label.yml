# Labels pull requests from .github/labeler.yml, by changed paths and by
# branch prefix.
name: Labeler

# pull_request_target, so the token can label pull requests from forks. The
# job checks nothing out and runs nothing from the pull request: the labeler
# reads its configuration from the base branch through the API.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read # read .github/labeler.yml
      pull-requests: write # apply the labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
