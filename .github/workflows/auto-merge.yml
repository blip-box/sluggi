# Enables squash auto-merge on every Dependabot pull request, so an update
# lands on its own once the required checks on main pass. The ruleset
# requires no approving review, which is what lets a bot's change merge.
name: Auto Merge Dependabot PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  automerge:
    # The pull request's author, not github.actor: a re-run by a person
    # changes the actor, and so would a push by someone else.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'blip-box/sluggi'
    runs-on: ubuntu-latest
    # The default token is read-only; the auto-merge API needs these scopes.
    permissions:
      contents: write # merge the pull request once the checks pass
      pull-requests: write # enable auto-merge on the pull request
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
